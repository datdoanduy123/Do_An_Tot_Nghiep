<div class="ai-task-generator-container">
  <!-- File Upload Section -->
  <div class="upload-section" *ngIf="currentStep === 0">
    <nz-upload
      nzType="drag"
      [nzMultiple]="false"
      [nzBeforeUpload]="beforeUpload"
      (nzChange)="removeFile()"
    >
      <p class="ant-upload-drag-icon">
        <span nz-icon nzType="inbox"></span>
      </p>
      <p class="ant-upload-text">Nhấp hoặc kéo file vào khu vực này để tải lên</p>
      <p class="ant-upload-hint">
        Hỗ trợ các định dạng file: PDF, DOC, DOCX, TXT. Dung lượng file tối đa 10MB.
      </p>
    </nz-upload>

    <div *ngIf="fileName" class="file-info">
      <span>File đã chọn: {{ fileName }}</span>
      <button nz-button nzType="text" nzDanger (click)="removeFile()">
        <span nz-icon nzType="delete"></span>
      </button>
    </div>

    <button
      nz-button
      nzType="primary"
      [disabled]="!selectedFile"
      [nzLoading]="isProcessing"
      (click)="generateWithAI()"
      class="generate-btn"
    >
      <span nz-icon nzType="experiment"></span>
      Giao việc bằng AI
    </button>
  </div>

  <!-- Processing Steps Section -->
  <div *ngIf="isProcessing" class="processing-section">
    <nz-spin nzTip="AI đang xử lý, vui lòng chờ...">
      <div class="spin-content"></div>
    </nz-spin>
  </div>
</div>

<!-- Modal to display AI-generated project -->
<app-modal-ai-task-generator
  [isVisible]="isResultModalVisible"
  [generatedProject]="generatedProject"
  (closeModal)="closeResultModal()"
></app-modal-ai-task-generator>
